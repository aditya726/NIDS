[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "0.1.0"
description = "Network intrusion detection system capture and ingestion foundation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-dotenv>=1.0"]
capture = ["scapy>=2.5"]
redis = ["redis>=5.0"]
ml = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3"]
agentic = ["langgraph>=0.2", "langchain-ollama>=0.2"]
analytics = ["geoip2>=4.8", "psutil>=6.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
